<!DOCTYPE html>
<html>
<head>
    <title>My Simple Page</title>
</head>
<body>
    <h1 style="color: blue;">Welcome to My Page</h1>
    
    <h2>Section One</h2>
    
    <p>This is a paragraph with some text.</p>
    
    <img src="https://via.placeholder.com/100" alt="placeholder">
    
    <a href="https://example.com">Click here</a>
    
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
    </ul>
    
    <ol>
        <li>First</li>
        <li>Second</li>
    </ol>
    
    <table border="1">
        <tr>
            <th>Header 1</th>
            <th>Header 2</th>
        </tr>
        <tr>
            <td>Data 1</td>
            <td>Data 2</td>
        </tr>
    </table>
    
    <span style="color: red;">Highlighted text</span>
    
    <div style="background-color: yellow; padding: 10px;">
        <p>This is a div section</p>
    </div>
    
    <br>
    
    <iframe width="200" height="100" src="https://example.com"></iframe>
    
    <form>
        <input type="text" placeholder="Enter name">
        <input type="submit">
    </form>
</body>
</html>
